_schema-version: 3.3.0
ID: CAPM_Project
description: A simple CAP project.
version: 1.0.0
modules:
- name: CAPM_Project-ui
  type: nodejs
  path: app
  requires:
  - name: srv-api
    group: destinations
    properties:
      forwardAuthToken: true
      name: srv-api
      strictSSL: true
      url: ~{srv-url}
  - name: CAPM_Project-auth
  parameters:
    buildpack: nodejs_buildpack
  build-parameters:
    builder: npm-ci
- name: CAPM_Project-srv
  type: nodejs
  path: gen/srv
  requires:
  - name: CAPM_Project-auth
  - name: CAPM_Project-db
  - name: capm_project-destination
  provides:
  - name: srv-api
    properties:
      srv-url: ${default-url}
  parameters:
    buildpack: nodejs_buildpack
    instances: 1
  build-parameters:
    builder: npm-ci
- name: CAPM_Project-db-deployer
  type: hdb
  path: gen/db
  requires:
  - name: CAPM_Project-db
  parameters:
    buildpack: nodejs_buildpack
- name: CAPM_Project
  type: approuter.nodejs
  path: app/router
  requires:
  - name: srv-api
    group: destinations
    properties:
      forwardAuthToken: true
      name: srv-api
      url: ~{srv-url}
  - name: CAPM_Project-html5-runtime
  - name: capm_project-destination
    group: destinations
    properties:
      forwardAuthToken: false
      name: ui5
      url: https://ui5.sap.com
  provides:
  - name: app-api
    properties:
      app-protocol: ${protocol}
      app-uri: ${default-uri}
  parameters:
    disk-quota: 256M
    keep-existing-routes: true
    memory: 256M
- name: CAPM_Project-app-deployer
  type: com.sap.application.content
  path: gen
  requires:
  - name: srv-api
  - name: CAPM_Project-html5-repo-host
    parameters:
      config:
        HTML5Runtime_enabled: true
      content-target: true
  build-parameters:
    build-result: app/
    requires:
    - artifacts:
      - purchaseorderapp.zip
      name: CAPM_Projectpurchaseorderapp
      target-path: app/
    - artifacts:
      - invanus4orders.zip
      name: invanus4orders
      target-path: app/
- name: CAPM_Projectpurchaseorderapp
  type: html5
  path: app/purchaseorderapp
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
- name: invanus4orders
  type: html5
  path: app/s4orders
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
resources:
- name: CAPM_Project-auth
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      oauth2-configuration:
        credential-types:
        - binding-secret
        - x509
      tenant-mode: dedicated
      xsappname: CAPM_Project-${org}-${space}
    path: ./xs-security.json
    service: xsuaa
    service-plan: application
- name: CAPM_Project-db
  type: com.sap.xs.hdi-container
  parameters:
    service: hana
    service-plan: hdi-shared
- name: CAPM_Project-html5-repo-host
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-plan: app-host
- name: CAPM_Project-html5-runtime
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-plan: app-runtime
- name: capm_project-destination
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      HTML5Runtime_enabled: false
      init_data:
        instance:
          destinations:
          - Authentication: NoAuthentication
            Name: ui5
            ProxyType: Internet
            Type: HTTP
            URL: https://ui5.sap.com
          - Authentication: NoAuthentication
            HTML5.DynamicDestination: true
            HTML5.ForwardAuthToken: true
            Name: srv-api
            ProxyType: Internet
            Type: HTTP
            URL: ~{srv-api/srv-url}
          existing_destinations_policy: update
    service: destination
    service-plan: lite
  requires:
  - name: srv-api
parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true
build-parameters:
  before-all:
  - builder: custom
    commands:
    - npm install
    - npx cds build --production
